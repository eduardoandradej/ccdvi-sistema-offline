# Proxy reverso: frontend e API na MESMA origem (cookies SameSite=Strict, sem CORS).
# Para HTTPS interno, adicione certificados institucionais (listen 8443 ssl) — ver docs/INSTALACAO.md.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 30m;   # acima de DVI_MAX_UPLOAD_MB (validação real ocorre na API)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Nenhum recurso externo é permitido: tudo é servido pelo próprio servidor da rede local.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://dvi-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
